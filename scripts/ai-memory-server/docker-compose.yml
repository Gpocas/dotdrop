name: ai-memory-tls
services:
  ai-memory:
    image: akitaonrails/ai-memory:3.1.0
    container_name: ai-memory
    restart: unless-stopped
    expose:
      - "49374"
    volumes:
      - ai-memory-data:/data
    env_file:
      - .env.production
    environment:
      - RUST_LOG=ai_memory=info,ai_memory_store=info,ai_memory_wiki=info,ai_memory_mcp=info,tracing_appender=warn
    healthcheck:
      test: ["CMD", "/usr/local/bin/ai-memory", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
  caddy:
    image: caddy:2-alpine
    container_name: ai-memory-caddy
    restart: unless-stopped
    depends_on:
      - ai-memory
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  ai-memory-data:
    name: ai-memory-data
  caddy-data:
  caddy-config:
